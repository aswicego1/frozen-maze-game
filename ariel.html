<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Ariel's Reef Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b2a6b;font-family:'Segoe UI',Arial,sans-serif;color:#fff}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}
#frame{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#c{border-radius:16px;box-shadow:0 0 0 5px #7fe3d0,0 10px 30px #0008}
#pad{display:grid;grid-template-columns:repeat(3,clamp(60px,9vw,96px));grid-template-rows:repeat(3,clamp(60px,9vw,96px));gap:8px}
.b{background:linear-gradient(160deg,#2bb6a3,#17707f);border:3px solid #c9fff3;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff}
.b:active{transform:scale(.92)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(8,30,80,.88);z-index:5;text-align:center;padding:20px}
h1{font-size:clamp(40px,8vw,80px);color:#9ff5e2;text-shadow:0 0 25px #2bb6a3}
p{font-size:clamp(18px,3vw,28px)}
.go{background:linear-gradient(160deg,#2bb6a3,#17707f);border:3px solid #c9fff3;border-radius:16px;padding:16px 44px;font-size:26px;font-weight:700;color:#fff}
#again{display:none;position:fixed;top:125px;left:50%;transform:translateX(-50%);z-index:6}
@media (orientation:landscape){#app{flex-direction:row;justify-content:center}#frame{min-width:0}#pad{flex:none}}
.home-pill{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.8);color:#fff;font:700 18px/1 Arial,sans-serif;text-decoration:none}
</style></head><body>
<div id="app"><div id="frame"><canvas id="c"></canvas></div>
<div id="pad"><div class="b" data-d="up" style="grid-area:1/2">&#9650;</div><div class="b" data-d="left" style="grid-area:2/1">&#9668;</div><div class="b" data-d="right" style="grid-area:2/3">&#9658;</div><div class="b" data-d="down" style="grid-area:3/2">&#9660;</div></div></div>
<div id="ov"><a class="home-pill" href="home.html">🏠 Home</a><h1>Ariel's Reef</h1><p>Find the pearl in the cave, rescue Eric at the surface, and watch out for the eels and Ursula!</p><button class="go" id="play">Play</button></div>
<button class="go" id="again">Play Again</button>
<a class="home-pill" id="homew" href="home.html" style="display:none">🏠 Home</a>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),again=document.getElementById('again');
const MZ=["1111111111111","1000000000001","1000000000001","1000000000001","1000000000001","1G11111111111","1000100111001","1110100000001","1000100101111","1010000100001","1111100111101","1000000000001","1111111111111"];
const SX=1,SY=11,PX=11,PY=6,EX=5,EY=2;
let W,H,T,ox,oy,dpr=1,st='start',px,py,dpx,dpy,ex,ey,dex,dey,pearl,hasEric,inv,pop,gf,tm=0,last=0,rep=0,fw=[],bub=[],en=[];const hold={};
function size(){const f=document.getElementById('frame');dpr=window.devicePixelRatio||1;const A=1.45,fw_=Math.max(200,f.clientWidth-10),fh=Math.max(150,f.clientHeight-10);W=Math.min(fw_,fh*A);H=W/A;cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;T=Math.min(W/13,H/13);ox=(W-T*13)/2;oy=(H-T*13)/2}
window.addEventListener('resize',size);size();
function ell(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function rc(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
const sx=x=>ox+x*T+T/2,sy=y=>oy+y*T+T/2;
/* ---------- sprites ---------- */
function ariel(x,y,s,t){g.save();g.translate(x,y);g.scale(s,s);ell(0,-8,8.5,13,'#d6392b');ell(0,13+Math.sin(t*6)*1.5,6,11,'#2bb673');ell(0,24+Math.sin(t*6+1)*3,11,3.5,'#1f9d62');ell(0,0,6,9,'#f2c9a0');rc(-6,-2,12,5,'#b05cd1');ell(0,-12,6.2,6.8,'#f2c9a0');ell(-2.3,-12,.9,.9,'#111');ell(2.3,-12,.9,.9,'#111');ell(0,-17,6.6,3,'#d6392b');g.restore()}
function eric(x,y,s){g.save();g.translate(x,y);g.scale(s,s);rc(-5,6,10,12,'#2d3a6b');rc(-6,-8,12,15,'#f4f4f4');rc(-6,-1,12,3,'#c0392b');ell(-8,0,2.5,6,'#f2c9a0');ell(8,0,2.5,6,'#f2c9a0');ell(0,-14,6.3,7,'#f2c9a0');ell(0,-19,7,4,'#2b1b12');ell(-2.4,-14,.9,.9,'#111');ell(2.4,-14,.9,.9,'#111');g.restore()}
function eel(x,y,s,t,f){g.save();g.translate(x,y);g.scale(s*f,s);for(let i=9;i>=0;i--)ell(-i*3.2,Math.sin(t*6-i*.7)*3.5,5-i*.25,4.5-i*.25,i%2?'#7a4fc2':'#8e63d6');ell(3,-1,5.5,4.5,'#8e63d6');ell(4,-2.5,1.5,1.5,'#ffe14d');ell(4.4,-2.5,.6,.6,'#111');g.restore()}
function ursula(x,y,s,t){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#14101f';g.lineWidth=5;g.lineCap='round';for(let i=0;i<5;i++){g.beginPath();g.moveTo(-10+i*5,6);g.quadraticCurveTo(-14+i*7+Math.sin(t*4+i)*4,16,-12+i*6+Math.sin(t*4+i+1)*6,26);g.stroke()}ell(0,-17,9,10,'#f1f1f4');ell(0,2,11,10,'#14101f');ell(0,-3,9,7,'#a07ab8');ell(0,-9,6.5,7,'#a07ab8');ell(-2.5,-10,1,1.2,'#111');ell(2.5,-10,1,1.2,'#111');ell(0,-5.5,2.6,1.2,'#d4144a');g.restore()}
function flounder(x,y,s,t){g.save();g.translate(x,y);g.scale(s,s);ell(-11,0,5,4+Math.sin(t*8),'#3aa8e6');ell(0,0,10,6,'#ffd23f');ell(0,0,2.5,6,'#3aa8e6');ell(6,-1.5,1.5,1.5,'#fff');ell(6.4,-1.5,.7,.7,'#111');g.restore()}
function sebastian(x,y,s,t){g.save();g.translate(x,y);g.scale(s,s);const a=Math.sin(t*8)*3;ell(-12,-6+a,5,4,'#e8392b');ell(12,-6-a,5,4,'#e8392b');ell(0,0,10,7,'#e8392b');ell(-3,-5,1.8,1.8,'#fff');ell(3,-5,1.8,1.8,'#fff');ell(-3,-5,.8,.8,'#111');ell(3,-5,.8,.8,'#111');g.restore()}
/* ---------- game ---------- */
function reset(){ov.style.display='none';again.style.display='none';document.getElementById('homew').style.display='none';st='play';px=dpx=SX;py=dpy=SY;ex=dex=SX;ey=dey=SY;pearl=false;hasEric=false;inv=1.2;pop=0;gf=0;fw=[];
en=[{k:'e',v:1,c:6,a:6,b:11,s:1.82,p:8,d:1},{k:'e',v:0,c:8,a:1,b:3,s:1.4,p:2,d:1},{k:'u',v:1,c:8,a:1,b:4,s:1.2,p:2,d:1}]}
document.getElementById('play').onclick=reset;again.onclick=reset;
function end(win){if(win){st='win';tm=0;again.style.display='block';document.getElementById('homew').style.display='block';bub=[];for(let i=0;i<30;i++)bub.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*.8,ph:Math.random()*6})}else{st='lose';ov.innerHTML='<a class="home-pill" href="home.html">🏠 Home</a><h1>Oh no!</h1><p>Ursula caught Ariel!</p><button class="go" id="play">Play Again</button>';ov.style.display='flex';document.getElementById('play').onclick=reset}}
function step(d){if(st!='play')return;const nx=px+(d=='right')-(d=='left'),ny=py+(d=='down')-(d=='up'),c=MZ[ny]&&MZ[ny][nx];if(!c||c=='1')return;if(c=='G'&&!pearl){gf=.7;return}
if(hasEric){ex=px;ey=py}px=nx;py=ny;
if(!pearl&&px==PX&&py==PY){pearl=true;pop=1}
if(!hasEric&&px==EX&&py==EY){hasEric=true;ex=EX;ey=EY;pop=1}
if(hasEric&&px==11&&py>=1&&py<=4)end(true)}
function press(d){hold[d]=1;step(d);rep=performance.now()+300}
document.querySelectorAll('.b').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();press(d)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{hold[d]=0}));b.addEventListener('contextmenu',e=>e.preventDefault())});
const km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
document.addEventListener('keydown',e=>{if(km[e.key]&&!e.repeat){e.preventDefault();press(km[e.key])}});document.addEventListener('keyup',e=>{if(km[e.key])hold[km[e.key]]=0});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<=350)e.preventDefault();lt=n},{passive:false});
function update(dt,now){tm+=dt;if(st=='win'){if(Math.random()<.05)fw.push({x:.15+Math.random()*.7,y:.1+Math.random()*.4,t:0,c:Math.random()<.5?'255,225,150':'190,235,255'});return}
if(st!='play')return;inv=Math.max(0,inv-dt);pop=Math.max(0,pop-dt);gf=Math.max(0,gf-dt);
if(now>rep){for(const d in hold)if(hold[d]){step(d);break}rep=now+170}
const k=Math.min(1,dt*16);dpx+=(px-dpx)*k;dpy+=(py-dpy)*k;dex+=(ex-dex)*k;dey+=(ey-dey)*k;
for(const e of en){e.p+=e.d*e.s*dt;if(e.p>e.b){e.p=e.b;e.d=-1}if(e.p<e.a){e.p=e.a;e.d=1}
const x=e.v?e.c:e.p,y=e.v?e.p:e.c;e.x=x;e.y=y;
if(inv<=0&&Math.hypot(x-dpx,y-dpy)<.65){if(e.k=='u'){end(false);return}px=dpx=SX;py=dpy=SY;if(hasEric){ex=dex=SX;ey=dey=SY}inv=1.5}}}
/* ---------- drawing ---------- */
function world(now){g.setTransform(dpr,0,0,dpr,0,0);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#8fe0ff');gr.addColorStop(.3,'#1f9bd1');gr.addColorStop(1,'#0b2a6b');g.fillStyle=gr;g.fillRect(0,0,W,H);
rc(ox,oy,13*T,T,'#ffd9a8');ell(ox+10.5*T,oy+.5*T,T*.35,T*.35,'#fff3b0');g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.beginPath();for(let x=0;x<=13*T;x+=6)g.lineTo(ox+x,oy+T+Math.sin(x/12+now*2)*3);g.stroke();
for(let y=1;y<13;y++)for(let x=0;x<13;x++){const c=MZ[y][x],X=ox+x*T,Y=oy+y*T;
if(c=='1'){const w=g.createLinearGradient(X,Y,X,Y+T);w.addColorStop(0,'#ff9a8a');w.addColorStop(1,'#d9546e');g.fillStyle=w;g.fillRect(X,Y,T,T);ell(X+T*.3,Y+T*.2,T*.17,T*.17,'#ffb7a6');ell(X+T*.7,Y+T*.3,T*.13,T*.13,'#ffb7a6');g.strokeStyle='#a83a58';g.lineWidth=1.5;g.strokeRect(X,Y,T,T)}
else if(c=='G'){if(!pearl){rc(X,Y,T,T,'#ff5ea8');for(let i=1;i<4;i++)rc(X+i*T/4-2,Y,4,T,'#ffd0e8');ell(X+T/2,Y+T/2,T*.18,T*.18,'#ffe066')}else{g.globalAlpha=.4+.3*Math.sin(now*5);ell(X+T/2,Y+T/2,T*.3,T*.3,'#fff');g.globalAlpha=1}}
else if(y==6&&x>=10)rc(X,Y,T,T,'#171a4a');else if(x==11&&y<5)rc(X,Y,T,T,'#f3d9a0');else if((x+y)%2)rc(X,Y,T,T,'rgba(255,255,255,.06)')}
if(!pearl){const gl=g.createRadialGradient(sx(PX),sy(PY),0,sx(PX),sy(PY),T*.8);gl.addColorStop(0,'rgba(255,255,255,.9)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;g.fillRect(sx(PX)-T,sy(PY)-T,2*T,2*T);ell(sx(PX),sy(PY)+Math.sin(now*4)*2,T*.2,T*.2,'#fff')}
if(!hasEric){const X=ox+EX*T,Y=oy+EY*T;rc(X+T*.05,Y+T*.65,T*.9,T*.22,'#a8683a');rc(X+T*.48,Y+T*.1,3,T*.55,'#6b4426');eric(sx(EX),sy(EY)+T*.05,T/40)}}
function actors(now){const s=T/34;if(hasEric)eric(sx(dex),sy(dey),s);
if(!(inv>0&&Math.floor(now*12)%2))ariel(sx(dpx),sy(dpy)-T*.1,s,now);
if(pop>0){g.strokeStyle='rgba(255,255,160,'+pop+')';g.lineWidth=4;g.beginPath();g.arc(sx(dpx),sy(dpy),(1-pop)*T*2,0,7);g.stroke()}
for(const e of en){if(e.x===undefined)continue;if(e.k=='e')eel(sx(e.x),sy(e.y),s*1.1,now,e.d)  ;else ursula(sx(e.x),sy(e.y)-T*.1,T/24,now)}
if(gf>0){g.fillStyle='rgba(255,94,168,'+gf*.4+')';g.fillRect(ox+T,oy+5*T,T,T)}
if(pearl)ell(ox+T*.6,oy+T*12.4,T*.25,T*.25,'#fff')}
function win(now){g.setTransform(dpr,0,0,dpr,0,0);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#ff9ec4');gr.addColorStop(.5,'#ffd9a8');gr.addColorStop(1,'#46b3e6');g.fillStyle=gr;g.fillRect(0,0,W,H);rc(0,H*.78,W,H*.22,'#f3d9a0');
g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();for(let x=0;x<=W;x+=6)g.lineTo(x,H*.78+Math.sin(x/20+now*2)*4);g.stroke();
bub.forEach(b=>{const y=((b.y-now*.05*b.s)%1+1)%1*H,x=b.x*W+Math.sin(now+b.ph)*14;g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;g.beginPath();g.arc(x,y,8*b.s*1.4,0,7);g.stroke()});
fw.forEach(f=>{f.t+=.016;for(let i=0;i<18;i++){const a=i/18*6.283,r=f.t*110;g.fillStyle='rgba('+f.c+','+Math.max(0,1-f.t/1.3)+')';g.beginPath();g.arc(f.x*W+Math.cos(a)*r,f.y*H+Math.sin(a)*r+f.t*f.t*30,3,0,7);g.fill()}});fw=fw.filter(f=>f.t<1.3);
const s=Math.min(W,H)/150,j=Math.abs(Math.sin(now*4))*H*.08;eric(W*.58,H*.7-j,s);ariel(W*.42,H*.68-j,s,now);flounder(W*.2,H*.6+Math.sin(now*3)*8,s*1.5,now);sebastian(W*.82,H*.84-Math.abs(Math.sin(now*5))*H*.05,s*1.3,now);
g.fillStyle='#fff';g.textAlign='center';g.font='900 '+Math.min(W/12,70)+'px Segoe UI,Arial';g.shadowColor='#e0457a';g.shadowBlur=22;g.fillText('Under the Sea Party!',W/2,Math.min(H*.14,90));g.shadowBlur=0}
function loop(t){requestAnimationFrame(loop);const now=t/1000,dt=Math.min(.05,now-last);last=now;update(dt,t);if(st=='win')win(now);else{world(now);if(st!='start')actors(now)}}
requestAnimationFrame(loop);
</script></body></html>
