const LB=document.querySelector('[data-d=left]'),RB=document.querySelector('[data-d=right]');const km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};

else if(st=='lamp'){if(tm>2.2){st='fly1';p=0;cy=300;tm=0}}
else if(st=='fly1'){const rem=L1-90-p;fly(dt,Math.max(80,Math.min(125,rem*.6+60)),L1-90);if(!hold.up&&!hold.down&&rem<500)cy+=(330-cy)*Math.min(1,dt*1.5);stars_(cx);if(Math.hypot(L1-p,cy-330)<150){st='board';tm=0}}
else if(st=='board'){if(tm>1.1){st='fly2';p=0;gap=700;boost=0;tm=0;jy2=cy;L2=LASTP+(FINAL_MAZE?150+Math.round(geo().Xr):250);makeObs(1)}}

else if(st=='zap'){if(tm>5.5)end(true)}

function maze(now){const t=Math.min(W/11,H/9),ox=(W-t*11)/2,oy=(H-t*9)/2;g.setTransform(dpr,0,0,dpr,0,0);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2b1b5a');gr.addColorStop(1,'#6a2f6e');g.fillStyle=gr;g.fillRect(0,0,W,H);

function flight(now){const cx=VW*.28,two=st!='fly1',mir=st=='fly2'||st=='zap'||st=='maze2';g.setTransform(dpr*S,0,0,dpr*S,0,0);if(mir){g.translate(VW,0);g.scale(-1,1)}

if(tm>3.7){for(let i=0;i<14;i++){const a=i*.45+tm,r=(tm-3.7)*120;g.fillStyle='#ffe066';g.fillRect(VW/2+Math.cos(a)*r,470+Math.sin(a)*r,6,6)}}}}
